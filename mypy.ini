[mypy]
python_version = 3.12
files = src/imap_mcp_gateway,tests
mypy_path = src
strict = True

[mypy-conftest]
# The e2e scenarios import their orchestrator conftest by module name
# (`from conftest import ...`): pytest loads it as a plugin and does not
# put tests/e2e on sys.path, so mypy cannot resolve the bare name from the
# source tree the way runtime does. Scoped to this one module name only —
# the conftest file itself remains fully type-checked via `files`.
ignore_missing_imports = True

[mypy-aiosmtpd.*]
# Build-time dependency of the e2e stub image only (not installed in the
# dev/e2e extras; no upstream type stubs exist). Scoped to this package.
ignore_missing_imports = True
